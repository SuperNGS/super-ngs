<div class="home-wrapper">
    @if( headshotURL !== undefined && bio != undefined ) {
        <img [src] = "headshotURL" alt="Headshot photo">
        <p>{{bio}}</p>
    } @else {
        <div class="loading">
            <div>
                <mat-spinner></mat-spinner>
            </div>
            <span>
                <h2>Loading, please wait...</h2>
            </span>
        </div>
    }
</div>
